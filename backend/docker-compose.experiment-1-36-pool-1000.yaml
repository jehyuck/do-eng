services:
  experiment-mock:
    image: "${DOENG_EXP136_MOCK_IMAGE:-doeng-exp136-mock-canonical:latest}"
    build: !reset null
    environment:
      MOCK_AI_RESULT: "true"
      MOCK_AI_DELAY_MS: "2000"
      MOCK_AI_STATUS: "200"
      MOCK_STORAGE_DELAY_MS: "100"
      MOCK_STORAGE_STATUS: "200"
      MOCK_LIFECYCLE_OBSERVATION_ENABLED: "false"
  flux-corrected:
    image: "${DOENG_EXP136_APP_IMAGE:-doeng-exp133-admission-off:a530aa6}"
    build: !reset null
    environment:
      DOENG_ADMISSION_MODE: "OFF"
      DOENG_AI_ADMISSION_ENABLED: "false"
      DOENG_ADMISSION_SCOPE: "FULL_PATH"
      DOENG_EXTERNAL_POOL_MODE: "SHARED"
      DOENG_SHARED_POOL_MAX_CONNECTIONS: "1000"
      DOENG_HTTP_MAX_CONNECTIONS: "1000"
      DOENG_SHARED_POOL_PENDING_MAX_COUNT: "800"
      DOENG_HTTP_PENDING_MAX_COUNT: "800"
      DOENG_HTTP_PENDING_ACQUIRE_MAX_COUNT: "800"
      DOENG_HTTP_PENDING_ACQUIRE_TIMEOUT_MS: "10000"
      DOENG_EXTERNAL_LEASING_STRATEGY: "FIFO"
      DOENG_EXTERNAL_MAX_IDLE_TIME_MS: "0"
      DOENG_EXTERNAL_EVICTION_INTERVAL_MS: "0"
      DOENG_TRANSPORT_ATTRIBUTION_ENABLED: "false"
      DOENG_STAGE_OBSERVATION_ENABLED: "false"
      DOENG_POOL_OBSERVATION_ENABLED: "false"
      DOENG_IDENTITY_PROBE_ENABLED: "false"
      DOENG_DIAGNOSTIC_ENABLED: "false"
