services:
  flux-corrected:
    environment:
      DOENG_AI_ADMISSION_ENABLED: "false"
      DOENG_ADMISSION_MODE: "OFF"
      DOENG_EXTERNAL_POOL_MODE: "SHARED"
      DOENG_SHARED_POOL_MAX_CONNECTIONS: "1000"
      DOENG_HTTP_MAX_CONNECTIONS: "1000"
      DOENG_SHARED_POOL_PENDING_MAX_COUNT: "800"
      DOENG_HTTP_PENDING_MAX_COUNT: "800"
      DOENG_HTTP_PENDING_ACQUIRE_MAX_COUNT: "800"
      DOENG_EXTERNAL_LEASING_STRATEGY: "FIFO"
      DOENG_EXTERNAL_MAX_IDLE_TIME_MS: "0"
      DOENG_EXTERNAL_EVICTION_INTERVAL_MS: "0"
      DOENG_POOL_OBSERVATION_ENABLED: "true"
      DOENG_STAGE_OBSERVATION_ENABLED: "true"
      DOENG_TRANSPORT_ATTRIBUTION_ENABLED: "true"
