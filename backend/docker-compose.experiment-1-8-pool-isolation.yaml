services:
  flux-corrected:
    image: doeng-flux-exp18-pool-isolation-20260802:latest
    build: null
    environment:
      DOENG_DIAGNOSTIC_ENABLED: "false"
      DOENG_POOL_OBSERVATION_ENABLED: "true"
      DOENG_STAGE_OBSERVATION_ENABLED: "true"
      DOENG_AI_ADMISSION_ENABLED: "false"
      DOENG_EXTERNAL_POOL_MODE: "${DOENG_EXTERNAL_POOL_MODE:-SHARED}"
      DOENG_HTTP_MAX_CONNECTIONS: "400"
      DOENG_SHARED_POOL_MAX_CONNECTIONS: "400"
      DOENG_SHARED_POOL_PENDING_MAX_COUNT: "800"
      DOENG_TOKEN_POOL_MAX_CONNECTIONS: "40"
      DOENG_TOKEN_POOL_PENDING_MAX_COUNT: "80"
      DOENG_AI_POOL_MAX_CONNECTIONS: "320"
      DOENG_AI_POOL_PENDING_MAX_COUNT: "640"
      DOENG_STORAGE_POOL_MAX_CONNECTIONS: "40"
      DOENG_STORAGE_POOL_PENDING_MAX_COUNT: "80"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics,doengdiagnosticpool,doengstages,doengadmission"
