services:
  experiment-mock:
    environment:
      MOCK_AI_RESULT: "true"
      MOCK_AI_DELAY_MS: "5000"
      MOCK_AI_STATUS: "200"
      MOCK_STORAGE_DELAY_MS: "0"
      MOCK_STORAGE_STATUS: "200"
      MOCK_STRICT_AUTH: "true"

  flux-corrected:
    environment:
      DOENG_DISPATCHER_TOKEN_CONCURRENCY: "1"
      DOENG_DISPATCHER_TOKEN_QUEUE_CAPACITY: "1"
      DOENG_DISPATCHER_AI_CONCURRENCY: "1"
      DOENG_DISPATCHER_AI_QUEUE_CAPACITY: "1"
      DOENG_DISPATCHER_STORAGE_CONCURRENCY: "1"
      DOENG_DISPATCHER_STORAGE_QUEUE_CAPACITY: "1"
      DOENG_DISPATCHER_GLOBAL_DEADLINE: "10s"
