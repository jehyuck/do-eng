services:
  experiment-mock:
    cpus: "4.0"
    mem_limit: 1g
    environment:
      MOCK_AI_RESULT: "true"
      MOCK_AI_DELAY_MS: "2000"
      MOCK_AI_STATUS: "200"
      MOCK_STORAGE_DELAY_MS: "100"
      MOCK_STORAGE_STATUS: "200"
      MOCK_CLOSE_BEFORE_RESPONSE: "false"
      MOCK_STRICT_AUTH: "true"
  flux-corrected:
    cpus: "2.0"
    mem_limit: 3g
    environment:
      DOENG_EXTERNAL_POOL_MODE: "ISOLATED"
      DOENG_SHARED_POOL_MAX_CONNECTIONS: "800"
      DOENG_SHARED_POOL_PENDING_MAX_COUNT: "1280"
      DOENG_TOKEN_POOL_MAX_CONNECTIONS: "100"
      DOENG_TOKEN_POOL_PENDING_MAX_COUNT: "160"
      DOENG_AI_POOL_MAX_CONNECTIONS: "600"
      DOENG_AI_POOL_PENDING_MAX_COUNT: "960"
      DOENG_STORAGE_POOL_MAX_CONNECTIONS: "100"
      DOENG_STORAGE_POOL_PENDING_MAX_COUNT: "160"
      DOENG_HTTP_PENDING_ACQUIRE_TIMEOUT_MS: "10000"
      DOENG_AI_ADMISSION_ENABLED: "false"
      DOENG_ADMISSION_MODE: "OFF"
      DOENG_ADMISSION_SCOPE: "FULL_PATH"
      DOENG_AI_ADMISSION_MAX_CONCURRENT: "400"
      DOENG_DISPATCHER_GLOBAL_DEADLINE: "10s"
      DOENG_DISPATCHER_TOKEN_CONCURRENCY: "100"
      DOENG_DISPATCHER_TOKEN_QUEUE_CAPACITY: "600"
      DOENG_DISPATCHER_AI_CONCURRENCY: "400"
      DOENG_DISPATCHER_AI_QUEUE_CAPACITY: "1200"
      DOENG_DISPATCHER_STORAGE_CONCURRENCY: "100"
      DOENG_DISPATCHER_STORAGE_QUEUE_CAPACITY: "600"
      DOENG_STAGE_OBSERVATION_ENABLED: "true"
      DOENG_POOL_OBSERVATION_ENABLED: "true"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,metrics,doengexperiment,doengdiagnosticpool,doengdiagnosticstage,doengadmission"
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx2g -XX:+UseG1GC"
