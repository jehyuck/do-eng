services:
  experiment-mock:
    cpus: "4.0"
    mem_limit: 1g
    environment:
      MOCK_AI_RESULT: "${MOCK_AI_RESULT:-true}"
      MOCK_AI_DELAY_MS: "${MOCK_AI_DELAY_MS:-2000}"
      MOCK_AI_STATUS: "${MOCK_AI_STATUS:-200}"
      MOCK_STORAGE_DELAY_MS: "${MOCK_STORAGE_DELAY_MS:-100}"
      MOCK_STORAGE_STATUS: "${MOCK_STORAGE_STATUS:-200}"
      MOCK_CLOSE_BEFORE_RESPONSE: "false"
      MOCK_STRICT_AUTH: "true"
  flux-corrected:
    cpus: "${APP_CPU:-2.0}"
    mem_limit: "${APP_MEMORY:-3g}"
    environment:
      DOENG_HTTP_MAX_CONNECTIONS: "${HTTP_MAX_CONNECTIONS:-400}"
      DOENG_HTTP_PENDING_MAX_COUNT: "${HTTP_PENDING_MAX_COUNT:-400}"
      # Legacy key retained for historical rendered-compose compatibility; current application ignores it.
      DOENG_HTTP_PENDING_ACQUIRE_MAX_COUNT: "800"
      DOENG_HTTP_PENDING_ACQUIRE_TIMEOUT_MS: "${HTTP_PENDING_ACQUIRE_TIMEOUT_MS:-10000}"
      DOENG_AI_ADMISSION_ENABLED: "false"
      DOENG_ADMISSION_MODE: "OFF"
      DOENG_ADMISSION_SCOPE: "FULL_PATH"
      DOENG_STAGE_OBSERVATION_ENABLED: "false"
      DOENG_POOL_OBSERVATION_ENABLED: "false"
      DOENG_EXPERIMENT_METRICS_ENABLED: "false"
      DOENG_TRANSPORT_OBSERVATION_ENABLED: "false"
      JAVA_TOOL_OPTIONS: "-Xms${JAVA_XMS:-512m} -Xmx${JAVA_XMX:-2g} -XX:+UseG1GC"
