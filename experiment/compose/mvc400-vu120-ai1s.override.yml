services:
  experiment-mock:
    cpus: "4.0"
    mem_limit: 1g
    environment:
      MOCK_AI_RESULT: "true"
      MOCK_AI_DELAY_MS: "1000"
      MOCK_AI_STATUS: "200"
      MOCK_STORAGE_DELAY_MS: "100"
      MOCK_STORAGE_STATUS: "200"

  mvc:
    cpus: "2.0"
    mem_limit: "4g"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx2048m -XX:+UseG1GC"
      DOENG_HTTP_MAX_CONNECTIONS: "400"
      DOENG_HTTP_CONNECT_TIMEOUT_MS: "2000"
      DOENG_HTTP_RESPONSE_TIMEOUT_MS: "10000"
      DOENG_HTTP_PENDING_ACQUIRE_TIMEOUT_MS: "10000"
      DOENG_DB_POOL_MAX_SIZE: "10"
      DOENG_MVC_MAX_THREADS: "400"
